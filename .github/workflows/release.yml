name: Screenshots — release

# Builds the .dmg, has Apple notarize it, and publishes it to blob.ciromaciel.click/tools/screenshots/
# and to GitHub Releases. The page at
# ciromaciel.click/tools/screenshots and the README point to the fixed latest/ link, so a
# release updates the download button without a site deploy.
#
# WHEN IT PUBLISHES: when VERSION is greater than the published one. Bumping VERSION and
# pushing to main is the release. A push without a new version only runs "plan".
#
# SIGNING: the Developer ID Application certificate of Ciro Cesar Maciel (secret
# MACOS_CERTIFICATE), imported into a throwaway keychain; scripts/build.sh finds it and signs
# with hardened runtime. That fixed identity keeps Screen Recording granted from one version to
# the next. Then Apple notarizes the .dmg (App Store Connect API key: NOTARY_KEY,
# NOTARY_KEY_ID, NOTARY_ISSUER_ID) and the ticket is stapled to it, so a browser download
# opens with no Terminal line.
#
# ILLUSTRATIONS: the official build adds the screens' licensed illustrations from the private
# ciro-maciel/assets, illustrations/screenshots (step "Licensed illustrations"); this repository never
# holds them.
#
# The secrets live in the "release" environment, which only main can use. Pull requests
# never see them.

on:
    push:
        branches: [main]
        paths:
            - 'VERSION'
            - 'Sources/**'
            - 'Resources/**'
            - 'scripts/**'
            - '.github/workflows/release.yml'
    workflow_dispatch:

concurrency:
    group: release
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    plan:
        runs-on: ubuntu-latest
        timeout-minutes: 3
        outputs:
            version: ${{ steps.plan.outputs.version }}
            go: ${{ steps.plan.outputs.go }}
        steps:
            - uses: actions/checkout@v4
              with:
                  sparse-checkout: VERSION
                  sparse-checkout-cone-mode: false
            - name: Compare with blob.ciromaciel.click
              id: plan
              run: |
                  VERSION="$(cat VERSION)"
                  PUBLISHED="$(curl -sf https://blob.ciromaciel.click/tools/screenshots/latest.json | sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' || true)"
                  GO=false
                  if [ -z "$PUBLISHED" ]; then GO=true
                  elif [ "$VERSION" != "$PUBLISHED" ] && [ "$(printf '%s\n%s\n' "$PUBLISHED" "$VERSION" | sort -V | tail -1)" = "$VERSION" ]; then GO=true
                  fi
                  echo "screenshots: $VERSION here, ${PUBLISHED:-none} published → $([ $GO = true ] && echo build || echo skip)"
                  echo "version=$VERSION" >>"$GITHUB_OUTPUT"
                  echo "go=$GO" >>"$GITHUB_OUTPUT"

    release:
        needs: plan
        if: needs.plan.outputs.go == 'true'
        name: Screenshots ${{ needs.plan.outputs.version }}
        runs-on: macos-15
        timeout-minutes: 30
        environment: release
        permissions:
            contents: write
        env:
            VERSION: ${{ needs.plan.outputs.version }}
        steps:
            - uses: actions/checkout@v4

            - name: Signing identity
              env:
                  CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
                  PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
              run: |
                  KC="$RUNNER_TEMP/signing.keychain-db"
                  KP="$(openssl rand -hex 16)"
                  echo "$CERTIFICATE" | base64 --decode >"$RUNNER_TEMP/signing.p12"
                  security create-keychain -p "$KP" "$KC"
                  security set-keychain-settings -lut 21600 "$KC"
                  security unlock-keychain -p "$KP" "$KC"
                  security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P "$PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
                  security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" >/dev/null
                  KEYCHAINS=("$KC")
                  while IFS= read -r line; do KEYCHAINS+=("$(echo "$line" | xargs)"); done < <(security list-keychains -d user)
                  security list-keychains -d user -s "${KEYCHAINS[@]}"
                  # The Developer ID G2 intermediate, in case the runner lacks it.
                  curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
                  security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KC" || true
                  security find-identity -v -p codesigning "$KC" | grep -q "Developer ID Application" ||
                      { echo "no Developer ID Application identity in MACOS_CERTIFICATE"; exit 1; }
                  rm -f "$RUNNER_TEMP/signing.p12"

            # The app is built on macOS 26 SDKs; the runner's default Xcode is older.
            - name: Newest Xcode
              run: |
                  XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
                  sudo xcode-select -s "$XCODE"
                  xcrun --show-sdk-version

            # The official build carries the welcome and history illustrations. They come from a
            # licensed stock gallery that can't be redistributed, so they live in the private
            # ciro-maciel/assets (illustrations/screenshots) and are read here with a read-only
            # deploy key; only that folder is checked out. A build from this repository alone
            # draws a Tabler icon instead.
            - name: Licensed illustrations
              env:
                  DEPLOY_KEY: ${{ secrets.ILLUSTRATIONS_DEPLOY_KEY }}
              run: |
                  KEY="$RUNNER_TEMP/assets-key"
                  printf '%s\n' "$DEPLOY_KEY" >"$KEY"
                  chmod 600 "$KEY"
                  # Exported, not inline: with a partial clone the sparse checkout fetches the files
                  # after the clone, and that fetch needs the key too.
                  export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
                  git clone -q --depth 1 --filter=blob:none --sparse git@github.com:ciro-maciel/assets.git "$RUNNER_TEMP/assets"
                  git -C "$RUNNER_TEMP/assets" sparse-checkout set illustrations/screenshots
                  rm -f "$KEY"
                  mkdir -p Resources/Illustrations
                  cp "$RUNNER_TEMP"/assets/illustrations/screenshots/*.png Resources/Illustrations/
                  for n in camera access editor; do
                      [ -f "Resources/Illustrations/$n.png" ] || { echo "missing illustration: $n"; exit 1; }
                  done
                  echo "✓ 3 illustrations"

            - name: Build
              run: |
                  bash scripts/build.sh
                  bash scripts/release/dmg-mac.sh dist/Screenshots.app "$RUNNER_TEMP/Screenshots-$VERSION-macos.dmg" "Screenshots by Ciro Cesar Maciel $VERSION"

            # The .dmg is signed too, then Apple checks it and the ticket is stapled to it:
            # Gatekeeper opens it offline with no warning.
            - name: Notarize
              env:
                  NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
                  NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
                  NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
              run: |
                  DMG="$RUNNER_TEMP/Screenshots-$VERSION-macos.dmg"
                  IDENTITY="$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
                  codesign --force --timestamp --sign "$IDENTITY" "$DMG"
                  KEY="$RUNNER_TEMP/notary.p8"
                  printf '%s\n' "$NOTARY_KEY" >"$KEY"
                  xcrun notarytool submit "$DMG" --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait --timeout 20m |
                      tee "$RUNNER_TEMP/notary.txt"
                  rm -f "$KEY"
                  grep -q "status: Accepted" "$RUNNER_TEMP/notary.txt" || { echo "notarization was not accepted"; exit 1; }
                  xcrun stapler staple "$DMG"

            - name: Publish to blob.ciromaciel.click
              run: bash scripts/release/publish-mac.sh screenshots Screenshots "$RUNNER_TEMP/Screenshots-$VERSION-macos.dmg" "$VERSION" 14
              env:
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

            - name: Publish to GitHub Releases
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  cat >"$RUNNER_TEMP/notes.md" <<NOTES
                  Install with one line: \`curl -fsSL https://blob.ciromaciel.click/tools/screenshots/install.sh | bash\`.

                  Or download the .dmg and drag Screenshots to Applications: signed with Developer ID and notarized by Apple. Apple Silicon, macOS 14+.

                  Coming from 0.1.x: this build is signed with Developer ID instead of a local certificate, so macOS asks once more for Screen & System Audio Recording.

                  Made by [Ciro Cesar Maciel](https://ciromaciel.click/?ref=oss-screenshots-release). [Follow @ciro-maciel](https://github.com/ciro-maciel) for the next open-source tools.
                  NOTES
                  sed -i '' 's/^ *//' "$RUNNER_TEMP/notes.md"
                  gh release create "v$VERSION" "$RUNNER_TEMP/Screenshots-$VERSION-macos.dmg" \
                      --title "Screenshots by Ciro Cesar Maciel $VERSION" --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/notes.md"
